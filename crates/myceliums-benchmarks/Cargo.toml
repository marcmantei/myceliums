[package]
name = "myceliums-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmarks for the Myceliums code intelligence engine — Criterion timings for indexing, parsing and queries, and a labelled retrieval-quality evaluation"
categories = ["development-tools"]
keywords = ["code-analysis", "knowledge-graph", "benchmarks", "developer-tools"]
readme = "../../README.md"
publish = false

[dependencies]
myceliums-core = { workspace = true }
myceliums-storage = { workspace = true }
# Same version and features as myceliums-core's; used only to name the
# reranker weights a run needs (see `eval::models`).
fastembed = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }

criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
chrono = { workspace = true }

[lib]
name = "myceliums_benchmarks"
path = "src/lib.rs"

[[bin]]
name = "retrieval-eval"
path = "src/bin/retrieval_eval.rs"

[[bin]]
name = "corpus-inventory"
path = "src/bin/corpus_inventory.rs"

[[bin]]
name = "ann-recall"
path = "src/bin/ann_recall.rs"

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "parsing"
harness = false
