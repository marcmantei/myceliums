[package]
name = "myceliums-benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Criterion benchmarks for the Myceliums code intelligence engine — indexing, query, agent tasks, and verified metrics"
categories = ["development-tools"]
keywords = ["code-analysis", "knowledge-graph", "benchmarks", "developer-tools"]
readme = "../../README.md"
publish = false

[dependencies]
myceliums-core = { workspace = true }
myceliums-storage = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }

criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
chrono = { workspace = true }
num_cpus = "1.16"

[lib]
name = "myceliums_benchmarks"
path = "src/lib.rs"

[[bin]]
name = "retrieval-eval"
path = "src/bin/retrieval_eval.rs"

[[bin]]
name = "corpus-inventory"
path = "src/bin/corpus_inventory.rs"

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "agent_tasks"
harness = false

[[bench]]
name = "verified_metrics"
harness = false

[[bench]]
name = "parsing"
harness = false
