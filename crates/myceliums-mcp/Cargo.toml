[package]
name = "myceliums-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for Myceliums — exposes 54 code-intelligence tools and 5 resource endpoints (1 static, 4 templated) over stdio transport for AI agent integration"
readme = "../../README.md"
keywords = ["code-analysis", "knowledge-graph", "mcp", "ai-agent", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = []
## Enable cross-repository comparison and adaptation planning (premium feature).
cross_repo = ["myceliums-core/cross_repo"]
## Expose thin public wrappers around the private tool handlers so integration
## tests can exercise handler logic without a full stdio transport. Kept out of
## `default` so the test-only API never leaks into production builds; the
## integration suite opts in via the self dev-dependency below, which keeps
## `cargo test --workspace` compiling the wrappers without any extra flags.
test-support = []

[dependencies]
myceliums-core = { workspace = true }
myceliums-storage = { workspace = true }
myceliums-cypher = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Enable the `test-support` wrappers for the integration suite only, so
# `cargo test --workspace` compiles the test-facing handler delegates without
# the feature ever reaching a production (non-dev) build.
myceliums-mcp = { path = ".", features = ["test-support"] }
