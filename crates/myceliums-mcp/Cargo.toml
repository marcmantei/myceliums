[package]
name = "myceliums-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for Myceliums — exposes 11 code-intelligence tools and 5 resources over stdio transport for AI agent integration"
readme = "../../README.md"
keywords = ["code-analysis", "knowledge-graph", "mcp", "ai-agent", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = []
## Enable cross-repository comparison and adaptation planning (premium feature).
cross_repo = ["myceliums-core/cross_repo"]

[dependencies]
myceliums-core = { workspace = true }
myceliums-storage = { workspace = true }
myceliums-cypher = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
