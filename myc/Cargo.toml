[package]
name = "myc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for the Myceliums code intelligence engine — analyze, search, query, detect impact, and serve an MCP endpoint for AI agents"
readme = "../README.md"
keywords = ["code-analysis", "knowledge-graph", "mcp", "tree-sitter", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]
documentation = "https://docs.rs/myc"

[[bin]]
name = "myc"
path = "src/main.rs"

[features]
pdf = ["myceliums-core/pdf"]

[dependencies]
myceliums-core = { workspace = true }
myceliums-storage = { workspace = true }
myceliums-mcp = { workspace = true }
myceliums-cypher = { workspace = true }
myceliums-http = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-kotlin = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-lua = { workspace = true }
tree-sitter-zig = { workspace = true }
tree-sitter-powershell = { workspace = true }
tree-sitter-elixir = { workspace = true }
tree-sitter-scala = { workspace = true }
tree-sitter-objc = { workspace = true }
tree-sitter-dart = { workspace = true }
walkdir = { workspace = true }
indicatif = { workspace = true }
dialoguer = { workspace = true }
console = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
