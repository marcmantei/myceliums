# cargo-fuzz targets for the Cypher engine and the tree-sitter extractors (#91).
#
# This crate is deliberately NOT part of the main workspace (see the empty
# `[workspace]` table below and `exclude` in the root Cargo.toml): it needs a
# nightly toolchain and libFuzzer, and must not affect stable builds.
# Run with `cargo +nightly fuzz run <target>`; see fuzz/README.md.
[package]
name = "myceliums-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
myceliums-core = { path = "../crates/myceliums-core" }
myceliums-cypher = { path = "../crates/myceliums-cypher" }
myceliums-storage = { path = "../crates/myceliums-storage" }

# Standalone workspace, so the fuzz crate is never built by `cargo build --workspace`.
[workspace]
members = ["."]

[[bin]]
name = "cypher_parse"
path = "fuzz_targets/cypher_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cypher_execute"
path = "fuzz_targets/cypher_execute.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_symbols"
path = "fuzz_targets/extract_symbols.rs"
test = false
doc = false
bench = false
