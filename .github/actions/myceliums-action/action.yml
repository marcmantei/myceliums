name: 'Myceliums Impact Analysis'
description: 'Analyze the blast radius of PR changes using a code knowledge graph. Function-level, deterministic, no cloud required.'
author: 'Marc Mantei'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  myc-version:
    description: 'Release of myc to install — a version like "0.3.1" or "latest". Every install is pinned to a release tag; the action never builds from a branch HEAD.'
    required: false
    default: 'latest'
  depth:
    description: 'Impact traversal depth (1-5). Higher = wider blast radius detection.'
    required: false
    default: '2'
  token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Install myc
      shell: bash
      run: |
        set -eu
        VERSION="${{ inputs.myc-version }}"
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        # Map architecture
        case "$ARCH" in
          x86_64|amd64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        # Map OS
        case "$OS" in
          linux) TARGET="${ARCH}-unknown-linux-gnu" ;;
          darwin) TARGET="${ARCH}-apple-darwin" ;;
          *) echo "::error::Unsupported OS: $OS"; exit 1 ;;
        esac

        # Resolve the requested version to a concrete tag before installing
        # anything. Both install paths below — pre-built binary and source build
        # — are pinned to that tag, so a run is reproducible and never picks up
        # whatever happens to be on the default branch when it executes.
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          TAG=$(curl -fsSL https://api.github.com/repos/marcmantei/myceliums/releases/latest \
            | grep -m1 '"tag_name"' | cut -d '"' -f 4 || true)

          # No published release yet: fall back to the highest version tag in the
          # repo. Still a fixed commit — just not one with binaries attached.
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs https://github.com/marcmantei/myceliums 'v*' \
              | cut -d '/' -f 3 | sort -V | tail -1 || true)
          fi
        else
          TAG="v${VERSION#v}"
        fi

        if [ -z "$TAG" ]; then
          echo "::error::Could not resolve a myc tag for myc-version '${VERSION}'. Pass an explicit version, e.g. myc-version: '0.3.1'."
          exit 1
        fi

        echo "Installing myc ${TAG} for ${TARGET}"
        DOWNLOAD_URL="https://github.com/marcmantei/myceliums/releases/download/${TAG}/myc-${TARGET}.tar.gz"

        if curl -fsSL "$DOWNLOAD_URL" -o /tmp/myc.tar.gz; then
          tar xzf /tmp/myc.tar.gz -C /tmp/
          chmod +x /tmp/myc
          sudo mv /tmp/myc /usr/local/bin/myc
        else
          echo "::warning::No pre-built binary for ${TARGET} at ${TAG}. Building from source at that tag..."
          cargo install --git https://github.com/marcmantei/myceliums --tag "$TAG" --locked myc
        fi

        myc --version

    - name: Analyze codebase
      shell: bash
      run: |
        echo "::group::Analyzing codebase"
        myc analyze . 2>&1
        echo "::endgroup::"

    - name: Generate impact report
      shell: bash
      id: impact
      env:
        DEPTH: ${{ inputs.depth }}
      run: |
        set -e

        # Generate diff between base and head
        git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || true
        DIFF=$(git diff origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff HEAD~1 2>/dev/null || echo "")

        if [ -z "$DIFF" ]; then
          echo "comment=No code changes detected." >> $GITHUB_OUTPUT
          exit 0
        fi

        # Save diff to temp file
        echo "$DIFF" > /tmp/pr_diff.patch

        # Run impact analysis
        IMPACT_OUTPUT=$(myc impact --diff /tmp/pr_diff.patch --depth "$DEPTH" 2>&1 || echo "Impact analysis completed with warnings")

        # Parse the output into structured markdown
        DIRECTLY_CHANGED=$(echo "$IMPACT_OUTPUT" | sed -n '/Directly changed/,/Indirectly affected\|Affected files\|Risk score/p' | grep '^\[' | head -20 || echo "")
        INDIRECTLY_AFFECTED=$(echo "$IMPACT_OUTPUT" | sed -n '/Indirectly affected/,/Affected files\|Risk score/p' | grep '^\[' | head -30 || echo "")
        RISK_SCORE=$(echo "$IMPACT_OUTPUT" | grep "Risk score" | head -1 || echo "Risk score: 0.00 / 10.00")

        # Count symbols
        DIRECT_COUNT=$(echo "$DIRECTLY_CHANGED" | grep -c '\[' 2>/dev/null || echo "0")
        INDIRECT_COUNT=$(echo "$INDIRECTLY_AFFECTED" | grep -c '\[' 2>/dev/null || echo "0")
        TOTAL=$((DIRECT_COUNT + INDIRECT_COUNT))

        # Determine risk emoji
        RISK_NUM=$(echo "$RISK_SCORE" | grep -oE '[0-9]+\.[0-9]+' | head -1 || echo "0")
        if [ "$(echo "$RISK_NUM > 7" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
          RISK_EMOJI="🔴"
        elif [ "$(echo "$RISK_NUM > 4" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
          RISK_EMOJI="🟡"
        else
          RISK_EMOJI="🟢"
        fi

        # Build the markdown comment with printf rather than a multi-line shell
        # string. Every line here must stay indented: inside a YAML block scalar
        # a line at column 0 terminates the block, which is what made this file
        # unparseable before.
        {
          printf '## 🔍 Myceliums Impact Analysis\n\n'
          printf '**Blast Radius:** %s symbols affected %s %s\n' \
            "$TOTAL" "$RISK_EMOJI" "$RISK_SCORE"

          if [ -n "$DIRECTLY_CHANGED" ] && [ "$DIRECT_COUNT" -gt 0 ]; then
            printf '\n### Directly Changed (%s)\n' "$DIRECT_COUNT"
            printf '```\n%s\n```\n' "$DIRECTLY_CHANGED"
          fi

          if [ -n "$INDIRECTLY_AFFECTED" ] && [ "$INDIRECT_COUNT" -gt 0 ]; then
            printf '\n### Indirectly Affected (%s)\n' "$INDIRECT_COUNT"
            printf '```\n%s\n```\n' "$INDIRECTLY_AFFECTED"
          fi

          if [ "$TOTAL" -eq 0 ]; then
            printf '\nNo symbols affected by this change. The diff may only touch comments, formatting, or non-code files.\n'
          fi

          printf '\n---\n'
          printf '<sub>Powered by <a href="https://github.com/marcmantei/myceliums">Myceliums</a> — the code knowledge graph engine. 54 MCP tools · 23 languages · local-first · no cloud required</sub>\n'
        } > /tmp/impact_comment.md

    - name: Post PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [ ! -f /tmp/impact_comment.md ]; then
          echo "No impact comment to post"
          exit 0
        fi

        PR_NUMBER=${{ github.event.pull_request.number }}
        REPO=${{ github.repository }}

        # Check for existing comment to update
        EXISTING_COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("Myceliums Impact Analysis")) | .id' \
          2>/dev/null | head -1 || echo "")

        BODY=$(cat /tmp/impact_comment.md)

        if [ -n "$EXISTING_COMMENT_ID" ]; then
          echo "Updating existing comment #${EXISTING_COMMENT_ID}"
          gh api "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
            -X PATCH \
            -f body="$BODY"
        else
          echo "Creating new comment"
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"
        fi

        echo "::notice::Impact analysis posted to PR #${PR_NUMBER}"
