name: Retrieval Quality (real repositories)

# Scores lexical, semantic, hybrid and hybrid+rerank on the held-out
# real-repository query set (#95), sweeps the hybrid fusion parameters on its
# development split and confirms the dev winner on the held-out split; scores
# every mode again with test code left in place and sweeps the test-code
# demotion weight the same way (#146). Writes the tables to the job summary
# and the full report as an artifact.
#
# Report-only. Indexing four real repositories with the embedding model and
# reranking 168 queries takes far longer than a pull request should wait, so it
# runs weekly and on demand; the per-PR golden-set gate in retrieval-quality.yml
# stays the blocking check. The job fails only when it cannot measure honestly
# (a checkout at the wrong commit, a label naming no corpus symbol, a sweep that
# no longer reproduces the production hybrid ranking) — never on the numbers.
# Method and recorded results: crates/myceliums-benchmarks/benchmarks/METHODOLOGY.md.

#
# Embedding variants (#157): dispatch with `variants`, a JSON list of
# {"id", "model", "template", "chunking"} objects, to score each variant in
# its own job (lexical, semantic and hybrid by default; no sweeps), then
# compare them against the variant with id "A" — the incumbent, by the
# protocol in METHODOLOGY.md — in a final job. For example:
#
#   gh workflow run retrieval-quality-real-repos.yml --ref <branch> \
#     -f variants='[{"id":"A","model":"multilingual-e5-small","template":"1","chunking":"off"},
#                   {"id":"B","model":"multilingual-e5-small","template":"2","chunking":"off"}]'

on:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list of {"id","model","template","chunking"}; empty runs the shipped configuration with every sweep'
        required: false
        default: ""
      modes:
        description: "Modes a variant job scores"
        required: false
        default: "lexical,semantic,hybrid"
      batch_tokens:
        description: "Most tokens per embedding batch (empty: the shipped default)"
        required: false
        default: ""
      release:
        description: "Build the evaluator in release mode once and run every variant with it (the cost measurements of #157)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # The weekly run and plain dispatches queue behind each other; every variant
  # dispatch runs on its own.
  group: ${{ inputs.variants != '' && format('retrieval-quality-variants-{0}', github.run_id) || 'retrieval-quality-real-repos' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same as retrieval-quality.yml: line tables keep the debug binaries small
  # enough for the runner's linker.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  real-repos:
    name: Real-repo retrieval and parameter sweep
    if: inputs.variants == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      # Shares the dependency cache of retrieval-quality.yml (see #119/#123).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: retrieval
          save-if: false
      - name: Build the evaluators
        run: cargo build -p myceliums-benchmarks --bin retrieval-eval --bin real-repo-eval --locked
      - name: Resolve cache keys
        id: keys
        # Model weights: the same key as retrieval-quality.yml, so the copy that
        # workflow saves from main is reused. Repositories: the pins only —
        # editing a label must not refetch the sources, changing a commit must.
        run: |
          echo "FASTEMBED_CACHE_DIR=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "HF_HOME=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "MYC_EVAL_REPOS_DIR=$HOME/.cache/myceliums-eval-repos" >> "$GITHUB_ENV"
          echo "models=${{ runner.os }}-$(target/debug/retrieval-eval --model-cache-key)" >> "$GITHUB_OUTPUT"
          pins="$(jq -c '.repos' crates/myceliums-benchmarks/real-repos/queries.json | sha256sum | cut -c1-16)"
          echo "repos=real-repos-${pins}" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-models
          key: ${{ steps.keys.outputs.models }}
      - name: Download model weights (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: target/debug/retrieval-eval --fetch-models
      - name: Restore repository checkouts
        id: repo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-repos
          key: ${{ steps.keys.outputs.repos }}
      - name: Fetch the pinned repositories
        # Leaves checkouts already at their pinned commit alone and refuses any
        # other state, so a stale cache cannot pass for the pinned sources.
        run: crates/myceliums-benchmarks/real-repos/fetch.sh
      - name: Save repository checkouts
        if: steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-repos
          key: ${{ steps.keys.outputs.repos }}
      - name: Score, sweep and confirm
        # The shipped batching since #157: texts sorted by length, batches of
        # at most 16,384 tokens (32 full windows) — the bound that keeps the
        # 16 GB runner alive, where 256 unsorted symbols per batch took it down
        # (#95). `nice` leaves the runner agent CPU while ONNX uses every core.
        run: |
          set -o pipefail
          nice -n 10 target/debug/real-repo-eval --out real-repo-report.json --summary "$GITHUB_STEP_SUMMARY" | tee real-repo.txt
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-repo-retrieval-report
          path: |
            real-repo-report.json
            real-repo.txt
          retention-days: 90

  build-release:
    # Costs — index time, query latency, memory — are measured with the build
    # users install; quality does not depend on the build mode (#157).
    name: Build the evaluator (release)
    if: inputs.variants != '' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - name: Build
        run: cargo build --release -p myceliums-benchmarks --bin real-repo-eval --bin real-repo-compare --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluator-release
          path: |
            target/release/real-repo-eval
            target/release/real-repo-compare
          retention-days: 7

  variant:
    name: Variant ${{ matrix.variant.id }} (${{ matrix.variant.model }}, template ${{ matrix.variant.template }}, chunking ${{ matrix.variant.chunking }})
    needs: build-release
    if: ${{ !cancelled() && inputs.variants != '' && needs.build-release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        if: ${{ !inputs.release }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        if: ${{ !inputs.release }}
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          shared-key: retrieval
          save-if: false
      - name: Build the evaluator
        if: ${{ !inputs.release }}
        run: |
          cargo build -p myceliums-benchmarks --bin real-repo-eval --locked
          echo "EVAL=target/debug/real-repo-eval" >> "$GITHUB_ENV"
      - name: Fetch the release evaluator
        if: ${{ inputs.release }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evaluator-release
          path: target/release
      - name: Use the release evaluator
        if: ${{ inputs.release }}
        run: |
          chmod +x target/release/real-repo-eval
          echo "EVAL=target/release/real-repo-eval" >> "$GITHUB_ENV"
      - name: Resolve cache keys
        id: keys
        run: |
          {
            echo "FASTEMBED_CACHE_DIR=$HOME/.cache/myceliums-eval-models"
            echo "HF_HOME=$HOME/.cache/myceliums-eval-models"
            echo "MYC_EVAL_REPOS_DIR=$HOME/.cache/myceliums-eval-repos"
          } >> "$GITHUB_ENV"
          pins="$(jq -c '.repos' crates/myceliums-benchmarks/real-repos/queries.json | sha256sum | cut -c1-16)"
          echo "repos=real-repos-${pins}" >> "$GITHUB_OUTPUT"
      - name: Restore repository checkouts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-repos
          key: ${{ steps.keys.outputs.repos }}
      - name: Fetch the pinned repositories
        run: crates/myceliums-benchmarks/real-repos/fetch.sh
      - name: Score the variant
        # Weights are downloaded from the pinned revision (and hash-checked)
        # by the evaluator; nothing is saved to the shared cache.
        env:
          MYC_EVAL_EMBEDDING_BATCH_TOKENS: ${{ inputs.batch_tokens }}
        run: |
          set -o pipefail
          nice -n 10 "$EVAL" --allow-model-download --no-sweep --no-demotion \
            --modes "${{ inputs.modes }}" \
            --model "${{ matrix.variant.model }}" --template "${{ matrix.variant.template }}" \
            --chunking "${{ matrix.variant.chunking }}" \
            --out "variant-${{ matrix.variant.id }}.json" --summary "$GITHUB_STEP_SUMMARY" \
            | tee "variant-${{ matrix.variant.id }}.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: variant-${{ matrix.variant.id }}
          path: |
            variant-${{ matrix.variant.id }}.json
            variant-${{ matrix.variant.id }}.txt
          retention-days: 90

  compare:
    name: Compare the variants
    if: ${{ !cancelled() && inputs.variants != '' }}
    needs: variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install protoc
        if: ${{ !inputs.release }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        if: ${{ !inputs.release }}
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          shared-key: retrieval
          save-if: false
      - name: Build the comparison
        if: ${{ !inputs.release }}
        run: |
          cargo build -p myceliums-benchmarks --bin real-repo-compare --locked
          mkdir -p target/release && cp target/debug/real-repo-compare target/release/
      - name: Fetch the release comparison
        if: ${{ inputs.release }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evaluator-release
          path: target/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: variant-*
          merge-multiple: true
      - name: Compare against variant A
        run: |
          set -o pipefail
          others=()
          for report in variant-*.json; do
            [ "$report" = variant-A.json ] || others+=("$report")
          done
          chmod +x target/release/real-repo-compare
          target/release/real-repo-compare --baseline variant-A.json "${others[@]}" \
            --out compare.json --summary "$GITHUB_STEP_SUMMARY" | tee compare.txt
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: variant-comparison
          path: |
            compare.json
            compare.txt
          retention-days: 90
