name: Retrieval Quality (real repositories)

# Scores lexical, semantic, hybrid and hybrid+rerank on the held-out
# real-repository query set (#95), sweeps the hybrid fusion parameters on its
# development split and confirms the dev winner on the held-out split; scores
# every mode again with test code left in place and sweeps the test-code
# demotion weight the same way (#146). Writes the tables to the job summary
# and the full report as an artifact.
#
# Report-only. Indexing four real repositories with the embedding model and
# reranking 168 queries takes far longer than a pull request should wait, so it
# runs weekly and on demand; the per-PR golden-set gate in retrieval-quality.yml
# stays the blocking check. The job fails only when it cannot measure honestly
# (a checkout at the wrong commit, a label naming no corpus symbol, a sweep that
# no longer reproduces the production hybrid ranking) — never on the numbers.
# Method and recorded results: crates/myceliums-benchmarks/benchmarks/METHODOLOGY.md.

on:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-quality-real-repos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same as retrieval-quality.yml: line tables keep the debug binaries small
  # enough for the runner's linker.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  real-repos:
    name: Real-repo retrieval and parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      # Shares the dependency cache of retrieval-quality.yml (see #119/#123).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: retrieval
          save-if: false
      - name: Build the evaluators
        run: cargo build -p myceliums-benchmarks --bin retrieval-eval --bin real-repo-eval --locked
      - name: Resolve cache keys
        id: keys
        # Model weights: the same key as retrieval-quality.yml, so the copy that
        # workflow saves from main is reused. Repositories: the pins only —
        # editing a label must not refetch the sources, changing a commit must.
        run: |
          echo "FASTEMBED_CACHE_DIR=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "HF_HOME=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "MYC_EVAL_REPOS_DIR=$HOME/.cache/myceliums-eval-repos" >> "$GITHUB_ENV"
          echo "models=${{ runner.os }}-$(target/debug/retrieval-eval --model-cache-key)" >> "$GITHUB_OUTPUT"
          pins="$(jq -c '.repos' crates/myceliums-benchmarks/real-repos/queries.json | sha256sum | cut -c1-16)"
          echo "repos=real-repos-${pins}" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-models
          key: ${{ steps.keys.outputs.models }}
      - name: Download model weights (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: target/debug/retrieval-eval --fetch-models
      - name: Restore repository checkouts
        id: repo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-repos
          key: ${{ steps.keys.outputs.repos }}
      - name: Fetch the pinned repositories
        # Leaves checkouts already at their pinned commit alone and refuses any
        # other state, so a stale cache cannot pass for the pinned sources.
        run: crates/myceliums-benchmarks/real-repos/fetch.sh
      - name: Save repository checkouts
        if: steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-repos
          key: ${{ steps.keys.outputs.repos }}
      - name: Score, sweep and confirm
        # With the shipped embedding batch (256 symbols of up to 512 tokens)
        # the evaluator was seen at ~11 GB RSS locally, and the first run on
        # the 16 GB runner lost the runner mid-indexing. A batch of 32 changes
        # only how symbols are padded together, not their vectors beyond float
        # noise. `nice` leaves the runner agent CPU while ONNX uses every core.
        env:
          MYC_EVAL_EMBEDDING_BATCH: "32"
        run: |
          set -o pipefail
          nice -n 10 target/debug/real-repo-eval --out real-repo-report.json --summary "$GITHUB_STEP_SUMMARY" | tee real-repo.txt
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-repo-retrieval-report
          path: |
            real-repo-report.json
            real-repo.txt
          retention-days: 90
