name: Retrieval Quality

# Scores all four search modes — lexical, semantic, hybrid, hybrid+rerank —
# against the golden set on every push and pull request, with the shipped
# default models, and writes the tables to the job summary.
#
# Fails only on a significant, material regression against
# crates/myceliums-benchmarks/golden/baseline.json: a gated metric whose paired
# bootstrap 95% interval lies wholly below zero AND whose drop is at least the
# documented minimal effect. Every other difference is reported, not blocking.
# The rule and its rationale: crates/myceliums-benchmarks/benchmarks/METHODOLOGY.md.
# An intended drop is accepted by re-recording the baseline in the same PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Matches CI: full debug info makes the workspace binaries large enough to
  # crash the linker on the 7 GB runners. Line tables keep file/line at a
  # fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  retrieval-quality:
    name: Retrieval Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hosted runners ship with ~14 GB free; the workspace target dir plus
      # the cargo cache exceeds that, which surfaced as ld dying with SIGBUS.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build the evaluator
        run: cargo build -p myceliums-benchmarks --bin retrieval-eval
      - name: Resolve the model weights cache
        id: models
        # fastembed reads HF_HOME, myceliums reads FASTEMBED_CACHE_DIR first:
        # point both at one directory outside the workspace. The key comes from
        # the evaluator itself, so it changes exactly when the shipped model ids
        # do.
        run: |
          echo "FASTEMBED_CACHE_DIR=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "HF_HOME=$HOME/.cache/myceliums-eval-models" >> "$GITHUB_ENV"
          echo "key=${{ runner.os }}-$(target/debug/retrieval-eval --model-cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-models
          key: ${{ steps.models.outputs.key }}
      - name: Download model weights (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: target/debug/retrieval-eval --fetch-models
      # Saved straight after the download rather than at the end of the job, so
      # a failing gate does not throw the ~2.8 GB download away.
      - name: Save model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/myceliums-eval-models
          key: ${{ steps.models.outputs.key }}
      - name: Evaluate retrieval quality and gate on regressions
        # No download opt-in here: the weights were fetched above, so a mode
        # that still cannot run is reported UNAVAILABLE and the gate fails
        # loudly instead of silently skipping it. The report lands on the
        # binary's default path, which .gitignore covers.
        run: |
          set -o pipefail
          target/debug/retrieval-eval --check-baseline --summary "$GITHUB_STEP_SUMMARY" | tee retrieval.txt
      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retrieval-quality-report
          path: |
            crates/myceliums-benchmarks/golden/report.json
            retrieval.txt
          retention-days: 90
