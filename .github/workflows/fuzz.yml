name: Fuzz

# Short cargo-fuzz runs over the Cypher engine and the tree-sitter extractors
# (#91). Each target gets FUZZ_SECONDS of libFuzzer time on nightly.
#
# Non-blocking by design: this workflow is not a required check. A crash
# fails the job and uploads the reproducer as an artifact; reproduce locally
# with `cargo +nightly fuzz run <target> <artifact-file>` (see fuzz/README.md).

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "crates/myceliums-cypher/**"
      - "crates/myceliums-core/src/parser.rs"
      # #100 splits parser.rs into a parser/ module; keep both until it lands.
      - "crates/myceliums-core/src/parser/**"
      - "crates/myceliums-core/src/dsl.rs"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUZZ_SECONDS: 60

# Third-party actions are pinned to a full commit SHA with the release in a
# comment, like ci.yml; Dependabot keeps the pins current.

jobs:
  # One job: the three targets share every dependency, so building them once
  # and running them back to back is far cheaper than a matrix, and keeps a
  # single fuzz/target cache entry (the Actions cache is capped at 10 GB).
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: nightly
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-
      # Built from source with the host toolchain: install-action has no
      # prebuilt cargo-fuzz for this version and its binstall fallback picks a
      # musl target that nightly-without-musl-std cannot build.
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked --version 0.13.2
      # cargo-fuzz has no --locked; fetching with it fails on a stale lock file.
      - name: Check fuzz/Cargo.lock is up to date
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      # `-s none`: the interesting native code (tree-sitter grammars) is built
      # by cc-rs without sanitizer flags, so ASan would only instrument safe
      # Rust. Debug assertions (`-a`) stay on to catch overflow and logic bugs.
      - name: Build fuzz targets
        run: cargo fuzz build -s none -a
      - name: Run each target for ${{ env.FUZZ_SECONDS }}s
        run: |
          for target in cypher_parse cypher_execute extract_symbols; do
            echo "::group::$target"
            dict=()
            case "$target" in
              cypher_*) dict=(-dict=fuzz/cypher.dict) ;;
            esac
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run -s none -a "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time=${{ env.FUZZ_SECONDS }} -max_len=4096 -timeout=10 "${dict[@]}"
            echo "::endgroup::"
          done
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
