name: Autofix

# Manual only: run it from the Actions tab (or `gh workflow run autofix.yml
# --ref <branch>`) against a PR branch, and it pushes a `style: apply rustfmt`
# commit there. It never runs on its own — format locally with
# `cargo fmt --all` before committing.
on:
  workflow_dispatch:

permissions: {}

jobs:
  rustfmt:
    name: Rustfmt Autofix
    runs-on: ubuntu-latest
    # Format a branch, never main directly, and never a tag (detached HEAD cannot be pushed).
    if: startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch
    permissions:
      # Push the format commit to the dispatched branch.
      contents: write
    steps:
      # Checks out the branch the workflow was dispatched on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply rustfmt"
          git push
