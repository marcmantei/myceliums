name: Retrieval Quality

# Scores search relevance against the golden set on every push and pull request
# and writes a current-vs-baseline table to the job summary.
#
# Report-only by design: a label fix, a deliberate ranking trade-off and a
# genuine regression all move the same number, so the job surfaces the delta and
# leaves the judgement to the reviewer. It never fails the build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Matches CI: full debug info makes the workspace binaries large enough to
  # crash the linker on the 7 GB runners. Line tables keep file/line at a
  # fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  retrieval-quality:
    name: Retrieval Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hosted runners ship with ~14 GB free; the workspace target dir plus
      # the cargo cache exceeds that, which surfaced as ld dying with SIGBUS.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Evaluate retrieval quality
        # Offline and deterministic: the corpus is parsed from in-repo fixtures,
        # and the evaluator refuses to run the modes that need model weights
        # rather than downloading them.
        run: |
          cargo run -p myceliums-benchmarks --bin retrieval-eval \
            -- --out golden-report.json | tee retrieval.txt
      - name: Compare against the recorded baseline
        # pipefail so a crash in the comparison fails the step instead of being
        # masked by tee's exit status.
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          baseline = json.load(open('crates/myceliums-benchmarks/golden/baseline.json'))
          current = json.load(open('golden-report.json'))

          print('## Retrieval quality — current vs baseline\n')
          print(f"Dataset `{current['dataset_version']}` · "
                f"{current['queries']} queries · {current['corpus_symbols']} symbols\n")
          print('| Mode | Metric | Baseline | Current | Δ |')
          print('| --- | --- | ---: | ---: | ---: |')

          for mode, now in current['results'].items():
              if now['status'] != 'MEASURED':
                  print(f"| `{mode}` | — | — | UNAVAILABLE | {now['reason']} |")
                  continue
              was = baseline['results'].get(mode, {})
              for metric in ('recall_at_1', 'recall_at_5', 'recall_at_10', 'mrr'):
                  before, after = was.get(metric), now[metric]
                  if before is None:
                      print(f"| `{mode}` | {metric} | — | {after:.4f} | new |")
                  else:
                      print(f"| `{mode}` | {metric} | {before:.4f} | {after:.4f} "
                            f"| {after - before:+.4f} |")

          print('\nReport-only: relevance changes never fail the build.')
          print('Methodology: `crates/myceliums-benchmarks/benchmarks/METHODOLOGY.md`.')
          PY
      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-report
          path: |
            golden-report.json
            retrieval.txt
          retention-days: 90
