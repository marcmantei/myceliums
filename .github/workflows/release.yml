name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the `release` job, which publishes the release
# and signs build provenance, gets write scopes — at job level.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # No musl target: ONNX Runtime publishes no musl binaries, so ort-sys
          # (reached via the default `embeddings` feature -> fastembed -> ort)
          # cannot build there. Not a configuration problem — see #61 for the
          # conditions under which it could come back. Because `release` needs
          # every matrix leg, leaving it in cost the entire release, not just
          # the one artifact.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macos-13 was retired by GitHub (Dec 2025) — jobs targeting it queue
          # forever instead of failing. macos-15-intel is the successor x86_64
          # image, available until Aug 2027 — tracked in #59.
          #
          # This must be a NATIVE x86_64 runner: cross-compiling this target from
          # an arm64 runner fails to link, because lance's AVX-512 kernel
          # (_sum_4bit_dist_table_32bytes_batch_avx512) is not built for the
          # non-host architecture. Verified locally on arm64 — do not "simplify"
          # this back to macos-latest.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # Pinned to a commit: cross's last tagged release (v0.2.5, 2023) ships
        # build images too old for this tree, so main is used — but a fixed
        # revision of it, not whatever HEAD is when the tag is pushed. The
        # matching build image is pinned by digest in Cross.toml; bump both
        # together.
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build binary
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} -p myc

      - name: Build binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked --target ${{ matrix.target }} -p myc

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../myc-${{ matrix.target }}.tar.gz myc
          cd ../../..

      - name: Generate SHA256 checksum
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 myc-${{ matrix.target }}.tar.gz > myc-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum myc-${{ matrix.target }}.tar.gz > myc-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: myc-${{ matrix.target }}
          if-no-files-found: error
          path: |
            myc-${{ matrix.target }}.tar.gz
            myc-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Create the GitHub Release and upload its assets.
      contents: write
      # Sign the provenance attestation with the workflow's OIDC identity
      # (Sigstore) and store it in the repository's attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec mv {} release/ \;
          find artifacts -type f -name '*.sha256' -exec mv {} release/ \;

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9

      # CycloneDX SBOM of the shipped binary, one per release target: every
      # crate `myc` links on that platform, with versions, licenses and hashes
      # from Cargo.lock. cargo-cyclonedx writes one file per workspace member;
      # only the `myc` package's is published. `--target` filters the resolved
      # graph by platform and needs no installed target toolchain.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-apple-darwin aarch64-apple-darwin; do
            cargo cyclonedx --manifest-path myc/Cargo.toml --format json \
              --spec-version 1.5 --target "$target" \
              --override-filename "myc-${target}.cdx"
            mv "myc/myc-${target}.cdx.json" release/
            test -s "release/myc-${target}.cdx.json"
          done

      - name: Generate combined checksums
        run: |
          cd release
          cat ./*.sha256 > checksums-sha256.txt
          sha256sum -- myc-*.cdx.json >> checksums-sha256.txt
          cat checksums-sha256.txt

      # SLSA build provenance for every release asset: who built it (this
      # workflow, this commit, this run) — verifiable with
      # `gh attestation verify <file> -R marcmantei/myceliums`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/myc-*.tar.gz
            release/myc-*.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            release/myc-*.tar.gz
            release/myc-*.cdx.json
            release/checksums-sha256.txt
