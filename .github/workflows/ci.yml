name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Full debug info makes the test binaries (20+ tree-sitter grammars, lance,
  # datafusion, onnxruntime) large enough to crash the linker on the 7 GB
  # runners. Line tables keep file/line in backtraces at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hosted runners ship with ~14 GB free; the workspace target dir plus
      # cargo cache exceeds that, which surfaced as ld dying with SIGBUS.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # myceliums-benchmarks' baseline provenance tests (issue #34) walk
          # git history to confirm the recorded commit_sha resolves and is an
          # ancestor of HEAD — a shallow (depth-1) checkout has neither, so
          # every PR would fail those tests regardless of content.
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --workspace

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clippy --workspace -- -D warnings

  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  benchmark:
    name: Benchmark & Verify Metrics
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Run verified metrics benchmark
        run: cargo bench -p myceliums-benchmarks --bench verified_metrics
      - name: Commit benchmark results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/metrics/ benchmarks/latest.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "perf: update verified metrics for ${{ github.ref_name }}" && git push origin main)

  retrieval-quality:
    name: Retrieval Quality
    runs-on: ubuntu-latest
    # Report-only: surfaces current-vs-baseline relevance so a reviewer can see
    # whether a change moved the numbers. It never fails the build on a metric
    # shift — a label fix, a deliberate ranking trade-off and a genuine
    # regression all move the same number, and only a human reading the diff can
    # tell them apart. It *does* fail on a missing or malformed report, because
    # that is a broken job rather than a judgement call.
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Evaluate retrieval quality
        # Offline and deterministic; embeddings are not needed for the lexical
        # mode. The report lands on the binary's default path, which is the path
        # .gitignore knows about — one location, so a stale report cannot be
        # committed by accident.
        run: |
          cargo run -p myceliums-benchmarks --bin retrieval-eval \
            --no-default-features | tee retrieval.txt
      - name: Compare against the recorded baseline
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          BASELINE = 'crates/myceliums-benchmarks/golden/baseline.json'
          REPORT = 'crates/myceliums-benchmarks/golden/report.json'
          REGENERATE = (
              'cargo run -p myceliums-benchmarks --bin retrieval-eval -- --update-baseline'
          )

          def load(path, what):
              """Read a JSON document, or fail with a message naming the fix."""
              try:
                  with open(path, encoding='utf-8') as handle:
                      return json.load(handle)
              except FileNotFoundError:
                  sys.exit(
                      f"::error::{what} not found at {path}. The evaluation step did not "
                      f"produce it — check the step above. Re-record with: {REGENERATE}"
                  )
              except json.JSONDecodeError as error:
                  sys.exit(
                      f"::error::{what} at {path} is not valid JSON (line {error.lineno}, "
                      f"column {error.colno}): {error.msg}. It is generated output — do not "
                      f"hand-edit it; re-record with: {REGENERATE}"
                  )

          def results(document, path, what):
              """The per-mode results map, or a clear failure if the shape is wrong."""
              modes = document.get('results')
              if not isinstance(modes, dict):
                  sys.exit(
                      f"::error::{what} at {path} has no 'results' object — the file does "
                      f"not match the schema this job reads. Re-record with: {REGENERATE}"
                  )
              return modes

          base = load(BASELINE, 'Recorded baseline')
          curr = load(REPORT, 'Current retrieval report')
          base_modes = results(base, BASELINE, 'Recorded baseline')
          curr_modes = results(curr, REPORT, 'Current retrieval report')

          print('## Retrieval quality — current vs baseline\n')
          if base.get('dataset_version') != curr.get('dataset_version'):
              print(
                  f"> **Ground truth changed** — baseline `{base.get('dataset_version')}` vs "
                  f"current `{curr.get('dataset_version')}`. Scores recorded against "
                  "different labels are not comparable; read the deltas below as "
                  "informational only.\n"
              )
          print(
              f"Dataset `{curr.get('dataset_version', 'unknown')}` · "
              f"{curr.get('queries', '?')} queries · "
              f"{curr.get('corpus_symbols', '?')} symbols\n"
          )
          print('| Mode | Metric | Baseline | Current | Δ |')
          print('| --- | --- | ---: | ---: | ---: |')
          for mode, now in sorted(curr_modes.items()):
              if now.get('status') != 'MEASURED':
                  print(f"| `{mode}` | — | — | UNAVAILABLE [*] | — |")
                  continue
              was = (base_modes.get(mode) or {}).get('metrics') or {}
              current = now.get('metrics') or {}
              for metric in ('recall_at_1', 'recall_at_5', 'recall_at_10', 'mrr'):
                  before, after = was.get(metric), current.get(metric)
                  if after is None:
                      print(f"| `{mode}` | {metric} | — | missing | — |")
                  elif before is None:
                      print(f"| `{mode}` | {metric} | — | {after:.4f} | new |")
                  else:
                      print(
                          f"| `{mode}` | {metric} | {before:.4f} | {after:.4f} "
                          f"| {after - before:+.4f} |"
                      )

          unavailable = [
              (mode, report.get('reason') or 'no reason recorded')
              for mode, report in sorted(curr_modes.items())
              if report.get('status') != 'MEASURED'
          ]
          if unavailable:
              print('\n[*] Not measured — **no numbers are reported** for these modes:\n')
              for mode, reason in unavailable:
                  print(f"- `{mode}` — {reason}")

          print('\nReport-only: relevance changes never fail the build.')
          print('Methodology: `crates/myceliums-benchmarks/benchmarks/METHODOLOGY.md`.')
          PY
      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-report
          path: |
            crates/myceliums-benchmarks/golden/report.json
            retrieval.txt
          retention-days: 90
