name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job here only reads the repository. A job that needs
# more must request it in its own `permissions:` block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debug info makes the test binaries (20+ tree-sitter grammars, lance,
  # datafusion, onnxruntime) large enough to crash the linker on the 7 GB
  # runners. Line tables keep file/line in backtraces at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Third-party actions are pinned to a full commit SHA (with the release in a
# comment) so a moved tag cannot change what runs here. Dependabot keeps the
# pins current (.github/dependabot.yml).
#
# Each job has its own cache key: build, test, clippy and MSRV compile
# different artifacts, and a shared key let whichever job saved first decide
# what every other job restored.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hosted runners ship with ~14 GB free; the workspace target dir plus
      # cargo cache exceeds that, which surfaced as ld dying with SIGBUS.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      # rust-cache drops workspace-crate artifacts before saving, so a restored
      # cache can never make cargo treat changed workspace sources as fresh
      # (plain actions/cache of target/ did exactly that on main after #114).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build
          # Only main saves: PR caches are unusable elsewhere and crowd the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # myceliums-benchmarks' baseline provenance tests (issue #34) walk
          # git history to confirm the recorded commit_sha resolves and is an
          # ancestor of HEAD — a shallow (depth-1) checkout has neither, so
          # every PR would fail those tests regardless of content.
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      # rust-cache drops workspace-crate artifacts before saving, so a restored
      # cache can never make cargo treat changed workspace sources as fresh
      # (plain actions/cache of target/ did exactly that on main after #114).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          # Only main saves: PR caches are unusable elsewhere and crowd the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # macOS is a shipped platform (Homebrew, two release targets), so the test
  # suite runs there too. arm64 only: the x86_64 macOS build is covered by the
  # release workflow's native Intel runner.
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Same reason as the Linux test job: provenance tests need history.
          fetch-depth: 0
      - name: Install protoc
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      # rust-cache drops workspace-crate artifacts before saving, so a restored
      # cache can never make cargo treat changed workspace sources as fresh
      # (plain actions/cache of target/ did exactly that on main after #114).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          # Only main saves: PR caches are unusable elsewhere and crowd the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: clippy
      # rust-cache drops workspace-crate artifacts before saving, so a restored
      # cache can never make cargo treat changed workspace sources as fresh
      # (plain actions/cache of target/ did exactly that on main after #114).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          # Only main saves: PR caches are unusable elsewhere and crowd the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Compiles the workspace with the oldest toolchain Cargo.toml promises
  # (`rust-version`). Keep the toolchain below in sync with that field.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: '1.88'
      # rust-cache drops workspace-crate artifacts before saving, so a restored
      # cache can never make cargo treat changed workspace sources as fresh
      # (plain actions/cache of target/ did exactly that on main after #114).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          # Only main saves: PR caches are unusable elsewhere and crowd the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # Supply-chain policy from deny.toml: RustSec advisories, licenses,
  # banned/duplicate crates and allowed sources.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
