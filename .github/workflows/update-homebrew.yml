name: Update Homebrew Formula

on:
  release:
    types: [published]
  # Manually re-syncable. Without this the tap can only be corrected by cutting
  # another release, and a failure here would stay invisible until then.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync, e.g. v0.3.2. Defaults to the latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-formula:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Syncing tap to $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: |
          curl -sL "https://github.com/marcmantei/myceliums/releases/download/${{ steps.version.outputs.tag }}/checksums-sha256.txt" -o checksums.txt
          cat checksums.txt

      - name: Parse checksums
        id: checksums
        run: |
          get_sha() {
            grep "$1" checksums.txt | awk '{print $1}'
          }
          echo "aarch64_apple=$(get_sha 'myc-aarch64-apple-darwin.tar.gz')" >> "$GITHUB_OUTPUT"
          echo "x86_64_apple=$(get_sha 'myc-x86_64-apple-darwin.tar.gz')" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=$(get_sha 'myc-aarch64-unknown-linux-gnu.tar.gz')" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(get_sha 'myc-x86_64-unknown-linux-gnu.tar.gz')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: marcmantei/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cat > homebrew-tap/Formula/myc.rb << 'FORMULA'
          class Myc < Formula
            desc "Code knowledge graph engine for AI agents"
            homepage "https://github.com/marcmantei/myceliums"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/marcmantei/myceliums/releases/download/v${{ steps.version.outputs.version }}/myc-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.checksums.outputs.aarch64_apple }}"
              else
                url "https://github.com/marcmantei/myceliums/releases/download/v${{ steps.version.outputs.version }}/myc-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.checksums.outputs.x86_64_apple }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/marcmantei/myceliums/releases/download/v${{ steps.version.outputs.version }}/myc-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.checksums.outputs.aarch64_linux }}"
              else
                url "https://github.com/marcmantei/myceliums/releases/download/v${{ steps.version.outputs.version }}/myc-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.checksums.outputs.x86_64_linux }}"
              end
            end

            def install
              bin.install "myc"
            end

            test do
              assert_match "myc", shell_output("#{bin}/myc --version")
            end
          end
          FORMULA

      - name: Fix indentation
        run: sed -i 's/^          //' homebrew-tap/Formula/myc.rb

      - name: Commit and push
        run: |
          set -eu
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/myc.rb

          # Re-syncing a tag the tap already carries is a valid no-op, not a
          # failure — `git commit` would otherwise exit non-zero on an empty
          # index and fail the run.
          if git diff --cached --quiet; then
            echo "Formula already matches ${{ steps.version.outputs.tag }} — nothing to push."
            exit 0
          fi

          git commit -m "Update myc to ${{ steps.version.outputs.version }}"
          git push
