name: Benchmarks

# Criterion timing benchmarks (indexing, parsing, query). Manual only: timings
# on shared runners are too noisy to gate on, so a run produces numbers to read,
# not a pass/fail signal on performance — but a bench that fails to build or
# panics fails the run. Retrieval *quality* is scored on every push and pull
# request by retrieval-quality.yml.

on:
  # Disabled for v0.1.x — run manually only during optimization phase
  # Re-enable on push triggers once benchmark suite is stabilized
  # push:
  #   tags:
  #     - 'v*'
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Compile benchmarks
        run: cargo bench -p myceliums-benchmarks --no-run

      - name: Run benchmarks
        run: cargo bench -p myceliums-benchmarks

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            target/criterion/
          retention-days: 90
