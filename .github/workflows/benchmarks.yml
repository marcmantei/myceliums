name: Benchmarks

on:
  # Disabled for v0.1.x — run manually only during optimization phase
  # Re-enable on push triggers once benchmark suite is stabilized
  # push:
  #   tags:
  #     - 'v*'
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run benchmarks
        run: cargo bench -p myceliums-benchmarks --no-run
        continue-on-error: true

      - name: Compile benchmarks
        run: cargo bench -p myceliums-benchmarks -- --verbose
        continue-on-error: true

      - name: Generate JSON report
        if: always()
        run: |
          mkdir -p benchmarks/results
          if [ -d target/criterion ]; then
            find target/criterion -name "*.json" -type f | head -1 | xargs -I {} cp {} benchmarks/results/benchmark-latest.json 2>/dev/null || true
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            target/criterion/
            benchmarks/results/
          retention-days: 90

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = 'benchmarks/results/benchmark-latest.json';
            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const comment = `## 📊 Benchmark Results\n\n**Version:** ${results.version}\n\n**Timestamp:** ${results.timestamp}\n\n[View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
