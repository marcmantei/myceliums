# Benchmark Repository Registry
# Used by benchmarks/run.sh to clone, analyze, and validate token reduction
#
# Usage:
#   ./benchmarks/run.sh                          # Run all repos
#   ./benchmarks/run.sh --language typescript     # Run all TypeScript repos
#   ./benchmarks/run.sh --repo zod               # Run single repo
#   ./benchmarks/run.sh --language python --repo fastapi  # Specific

[typescript.zod]
url = "https://github.com/colinhacks/zod.git"
branch = "main"
stars = "35k"
category = "Validation"
questions = [
    { id = "callers", label = "Who calls safeParse?", grep_pattern = "safeParse", cypher = "MATCH (s)-[:CALLS]->(t) WHERE t.name = 'safeParse' RETURN s.name, s.kind" },
    { id = "classes", label = "List all classes", grep_pattern = "class ", cypher = "MATCH (s) WHERE s.kind = 'Class' RETURN s.name LIMIT 30" },
    { id = "blast_radius", label = "Blast radius of addIssueToContext", grep_pattern = "addIssueToContext", cypher = "MATCH (s)-[:CALLS]->(t) WHERE t.name = 'addIssueToContext' RETURN s.name, s.kind" },
    { id = "call_graph", label = "What does parse call?", grep_pattern = "parse", cypher = "MATCH (s)-[:CALLS]->(t) WHERE s.name = 'parse' RETURN s.name, t.name LIMIT 20" },
    { id = "error_types", label = "Find all Error interfaces", grep_pattern = "Error", cypher = "MATCH (s) WHERE s.name CONTAINS 'Error' AND s.kind = 'Interface' RETURN s.name, s.kind" },
    { id = "process_flow", label = "Trace parse execution flow", grep_pattern = "parse", processes_entry = "parse" },
]

